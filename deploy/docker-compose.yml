# Run podswitch on any machine that can reach the cluster's API, e.g. a small always-on box,
# so the page can still say "offline" while the cluster is switched off.
#   data/token, data/ca.crt   from rbac.yaml (see there)
name: podswitch

services:
  podswitch:
    build: ..                     # or: image: ghcr.io/xuedi/podswitch:latest
    container_name: podswitch
    restart: unless-stopped
    ports:
      - "8080:8080"               # LAN; use "127.0.0.1:8080:8080" behind a reverse proxy
    environment:
      PODSWITCH_API: https://192.168.1.10:6443
      PODSWITCH_NAME: homelab     # optional, default: the first node's name
      TZ: Europe/Berlin           # optional, for the clock in the header
      # Optional "Power on" button on the offline page, here through a BMC's Redfish API
      # (README, "Power on"); data/power-on-auth holds user:password.
      # PODSWITCH_POWER_ON_URL: https://192.168.1.11/redfish/v1/Systems/1/Actions/ComputerSystem.Reset/
      # PODSWITCH_POWER_ON_BODY: '{"ResetType": "On"}'
      # PODSWITCH_POWER_ON_AUTH: /data/power-on-auth
      # PODSWITCH_POWER_ON_INSECURE: "true"
    volumes:
      - ./data:/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
