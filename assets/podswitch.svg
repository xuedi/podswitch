<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>podswitch</title>
  <!-- wall switch plate -->
  <rect x="148" y="22" width="88" height="140" rx="18" fill="#ffffff" stroke="#241f31" stroke-width="6"/>
  <circle cx="192" cy="38" r="4" fill="#c0bfbc"/>
  <circle cx="192" cy="146" r="4" fill="#c0bfbc"/>
  <!-- toggle slot and lever, flipped up: on -->
  <rect x="174" y="54" width="36" height="80" rx="18" fill="#deddda" stroke="#241f31" stroke-width="5"/>
  <rect x="168" y="50" width="48" height="46" rx="16" fill="#326ce5" stroke="#241f31" stroke-width="5"/>
  <path d="M178 62h28" stroke="#8fb0f2" stroke-width="5" stroke-linecap="round"/>
  <!-- on light -->
  <circle cx="226" cy="128" r="6" fill="#33d17a" stroke="#241f31" stroke-width="3"/>
  <!-- flip sparks -->
  <path d="M158 44l-12-8M162 30l-6-12M150 58l-14-2" stroke="#f6d32d" stroke-width="5" stroke-linecap="round"/>
  <!-- the arm: a pea tendril reaching up to the lever -->
  <path d="M150 176c16-14 20-40 24-76" fill="none" stroke="#241f31" stroke-width="20" stroke-linecap="round"/>
  <path d="M150 176c16-14 20-40 24-76" fill="none" stroke="#57e389" stroke-width="10" stroke-linecap="round"/>
  <!-- curl at the tendril's end, pressing the lever -->
  <circle cx="176" cy="96" r="13" fill="#57e389" stroke="#241f31" stroke-width="5"/>
  <path d="M171 96a5 5 0 1 1 6 5" fill="none" stroke="#26a269" stroke-width="3" stroke-linecap="round"/>
  <!-- the pod: outer shell -->
  <path d="M14 204c6-34 54-54 108-54 26 0 40 6 42 16-2 34-50 62-104 62-28 0-48-8-46-24z" fill="#33d17a" stroke="#241f31" stroke-width="6" stroke-linejoin="round"/>
  <!-- open seam, the peas inside -->
  <path d="M30 202c10-20 54-36 98-36 14 0 22 2 26 6-8 22-46 40-88 40-22 0-36-4-36-10z" fill="#26a269" stroke="#241f31" stroke-width="4" stroke-linejoin="round"/>
  <!-- stem -->
  <path d="M160 168c10-4 16-2 22 4" fill="none" stroke="#241f31" stroke-width="5" stroke-linecap="round"/>
  <!-- three peas with faces -->
  <g stroke="#241f31" stroke-width="5">
    <circle cx="58" cy="196" r="17" fill="#8ff0a4"/>
    <circle cx="94" cy="186" r="18" fill="#8ff0a4"/>
    <circle cx="130" cy="178" r="17" fill="#8ff0a4"/>
  </g>
  <!-- shine -->
  <g fill="#ffffff" opacity=".8">
    <circle cx="51" cy="189" r="4"/>
    <circle cx="87" cy="178" r="4"/>
    <circle cx="123" cy="171" r="4"/>
  </g>
  <!-- eyes -->
  <g fill="#241f31">
    <circle cx="53" cy="197" r="2.6"/><circle cx="63" cy="197" r="2.6"/>
    <circle cx="89" cy="186" r="2.8"/><circle cx="99" cy="186" r="2.8"/>
    <circle cx="125" cy="177" r="2.6"/><circle cx="135" cy="177" r="2.6"/>
  </g>
  <!-- smiles; the middle pea, watching the switch, is the happiest -->
  <g fill="none" stroke="#241f31" stroke-width="2.6" stroke-linecap="round">
    <path d="M54 204q4 3 8 0"/>
    <path d="M88 193q6 6 12 0"/>
    <path d="M126 185q4 3 8 0"/>
  </g>
  <!-- cheeks -->
  <g fill="#f66151" opacity=".45">
    <circle cx="47" cy="202" r="3"/><circle cx="69" cy="202" r="3"/>
    <circle cx="83" cy="191" r="3"/><circle cx="105" cy="191" r="3"/>
    <circle cx="119" cy="183" r="3"/><circle cx="141" cy="183" r="3"/>
  </g>
</svg>
